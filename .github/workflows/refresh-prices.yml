name: Refresh prices (daily)

on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC daily (off-peak minute to avoid load spikes)
  workflow_dispatch: {}     # allow manual runs from the Actions tab

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Fetch current prices
        run: node scripts/refresh-prices.mjs
      - name: Check every price (automatic, daily)
        # If the check itself breaks, still commit the refresh; checked_at then
        # stays on the last good day and the sheet shows that date, not today's.
        continue-on-error: true
        run: node scripts/verify-agent.mjs
      - name: Open an issue when new models appear
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            // Prices need no human. This only tells you about brand-new models from
            // tracked labs, which are not added to the sheet automatically.
            const fs = require("fs");
            let pending = [];
            try { pending = JSON.parse(fs.readFileSync("data/discovered.json", "utf8")).filter(d => d.status === "pending"); } catch {}
            if (!pending.length) { core.info("no new models"); return; }
            const title = "New models found on OpenRouter";
            const body = `${pending.length} model(s) from tracked labs are not in the price sheet yet:\n\n` +
              pending.slice(0, 20).map(d => `- \`${d.slug}\` — $${d.inP} in / $${d.outP} out (released ${d.released || "?"})`).join("\n") +
              `\n\nTo add one: its slug in \`scripts/openrouter-map.json\` and an entry in \`data/prices.json\`. The daily check dates and confirms it from then on.\n\n_Updated automatically by the daily run._`;
            const open = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "new-models" });
            const existing = open.data.find(i => i.title === title);
            if (existing) await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ["new-models"] });

      - name: Commit if changed
        run: |
          git config user.name "perdollar-bot"
          git config user.email "bot@users.noreply.github.com"
          if ! git diff --quiet -- data/ feed/; then
            git add data/ feed/
            git commit -m "chore: daily price refresh ($(date -u +%F))"
            git push
          else
            echo "::error::the daily check ran but data/ and feed/ are unchanged. checked_at should advance on every successful run, so this means the script did not write, or it wrote somewhere nothing stages."
            exit 1
          fi
